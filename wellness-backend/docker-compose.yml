# Optional MySQL for teammates who don't use XAMPP/Laragon.
# Configured to match the default connection string (root, empty password,
# database "wellnessdb") so the SAME appsettings/.env works for XAMPP, Laragon,
# and Docker without changes.
#
#   docker compose up -d        # start MySQL on localhost:3306
#   docker compose down         # stop (data kept in the named volume)
#   docker compose down -v      # stop and DELETE all data
#
# NOTE: only run this if port 3306 is free (i.e. XAMPP/Laragon MySQL is stopped).
services:
  mysql:
    image: mysql:8.4
    container_name: wellness-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: wellnessdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
